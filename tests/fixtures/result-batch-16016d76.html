<!DOCTYPE html>
<!-- Layout regression from result@9b9f8a7fe09fd5a1dd6769315a0e2d69c2a339e7,
     batch 16016d76d59046b2b963879a56471469. The status is outside the center
     container. Inline rules reproduce the candidate-only main/header CSS;
     all scripts and remaining CSS are served from the current worktree. -->
<html lang="en" ng-app="catsvsdogs">
  <head>
    <meta charset="utf-8">
    <title>猫狗投票 · 实时结果</title>
    <base href="/index.html">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="stylesheet" href="/stylesheets/style.css" />
    <style>
      main { height: 100%; }
      h1 { font-size: 28px; margin: 0 0 20px; }
    </style>
  </head>
  <body ng-controller="statsCtrl">
    <div id="background-stats" aria-hidden="true">
      <div id="background-stats-1"></div>
      <div id="background-stats-2"></div>
    </div>
    <main>
      <div id="content-container">
        <div id="content-container-center">
          <h1>猫狗投票 · 实时结果</h1>
          <div id="choice">
            <div class="choice cats">
              <div class="label">猫派</div>
              <div id="cats-count" class="count">{{aCount || 0}}</div>
              <div class="stat">{{aPercent | number:1}}%</div>
            </div>
            <div class="divider"></div>
            <div class="choice dogs">
              <div class="label">狗派</div>
              <div id="dogs-count" class="count">{{bCount || 0}}</div>
              <div class="stat">{{bPercent | number:1}}%</div>
            </div>
          </div>
        </div>
        <p id="realtime-status">
          <span ng-if="!lastUpdated">等待实时数据</span>
          <span ng-if="lastUpdated" ng-cloak>最近更新：<time id="last-updated" ng-attr-datetime="{{lastUpdated}}">{{lastUpdated | date:'yyyy-MM-dd HH:mm:ss'}}</time></span>
        </p>
      </div>
    </main>
    <div id="result">
      <span id="total">
        总票数：<span id="total-count">{{total || 0}}</span>
      </span>
    </div>
    <script src="socket.io.js"></script>
    <script src="angular.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
