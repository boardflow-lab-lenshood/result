<!DOCTYPE html>
<html ng-app="catsvsdogs">
  <head>
    <meta charset="utf-8">
    <title>猫派 vs 狗派 -- Result</title>
    <base href="/index.html">
    <meta name = "viewport" content = "width=device-width, initial-scale = 1.0">
    <meta name="keywords" content="docker-compose, docker, stack">
    <meta name="author" content="Docker">
    <link rel='stylesheet' href='/stylesheets/style.css' />
  </head>
  <body ng-controller="statsCtrl" >
     <div id="background-stats">
       <div id="background-stats-1">
       </div><!--
      --><div id="background-stats-2">
      </div>
    </div>
    <div id="content-container">
      <div id="content-container-center">
        <div id="choice">
          <div class="choice cats">
            <div class="label">猫派</div>
            <div class="count" id="count-a">{{aCount}}</div>
            <div class="stat">{{aPercent | number:1}}%</div>
          </div>
          <div class="divider"></div>
          <div class="choice dogs">
            <div class="label">狗派</div>
            <div class="count" id="count-b">{{bCount}}</div>
            <div class="stat">{{bPercent | number:1}}%</div>
          </div>
        </div>
      </div>
    </div>
    <div id="result">
      <span id="total-label">总票数</span>
      <span id="total-count">{{total}}</span>
      <div id="realtime-status" aria-live="polite">
        <span id="waiting-for-data" ng-if="!lastUpdated">等待实时数据</span>
        <span id="last-updated-label" ng-if="lastUpdated">最近更新：</span>
        <time id="last-updated" ng-if="lastUpdated" datetime="{{lastUpdated}}">{{lastUpdated | date:'yyyy-MM-dd HH:mm:ss'}}</time>
      </div>
    </div>
    <script src="socket.io.js"></script>
    <script src="angular.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
